<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- BUILD:HEAD -->
<title>RE-BURST 第1章 試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Shippori+Mincho:wght@700&display=swap">
<style>
  /* 構成：左に国・党・人の計器、右に今の決断と、届いた知らせ（予兆）と経過。判断の道具として、数値と選択肢を最優先に置く */
  :root {
    --bg:#eceff2; --card:#ffffff; --ink:#18212c; --sub:#5a6674; --line:#d3d9e0; --acc:#2b4a80; --acc-ink:#ffffff;
    --good:#25785a; --bad:#b03a2a; --warn:#a1701a; --s1:#25785a; --s2:#b03a2a; --s3:#2b4a80; --s4:#a1701a; --s5:#7a5aa8;
    --font-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --font-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#12171d; --card:#1b222b; --ink:#e6eaef; --sub:#97a3b1; --line:#2f3945; --acc:#7da2e0; --acc-ink:#0f1722;
    --good:#5fc29c; --bad:#ee8a78; --warn:#e0b25a; --s1:#5fc29c; --s2:#ee8a78; --s3:#7da2e0; --s4:#e0b25a; --s5:#b79be6; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg:#12171d; --card:#1b222b; --ink:#e6eaef; --sub:#97a3b1; --line:#2f3945; --acc:#7da2e0; --acc-ink:#0f1722;
    --good:#5fc29c; --bad:#ee8a78; --warn:#e0b25a; --s1:#5fc29c; --s2:#ee8a78; --s3:#7da2e0; --s4:#e0b25a; --s5:#b79be6; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.7 var(--font-body); padding-block: 16px;
         padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font:700 20px/1.4 var(--font-display); margin: 0 0 2px; text-wrap: balance; }
  .lede { color: var(--sub); font-size: 13px; margin: 0 0 14px; max-width: 70ch; }
  .grid { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); gap: 12px; align-items:start; }
  @media (max-width: 780px) { .grid { grid-template-columns: minmax(0,1fr); } .right { order:-1; } }
  .col { display:grid; gap:12px; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; min-width:0; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .date { font:700 24px/1.2 var(--font-display); margin-bottom: 6px; }
  .world { font-size:12px; color:var(--sub); font-variant-numeric: tabular-nums; }
  .g { display:grid; grid-template-columns: 7.5em minmax(0,1fr) 2.4em; align-items:center; gap:8px; margin:5px 0; font-size:13px; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--bad); transition: width .3s; }
  .bar.good i { background: var(--good); }
  .bar.dbg i { background: var(--s5); }
  .g b { text-align:right; font-variant-numeric: tabular-nums; }
  h2 { font-size:12px; color:var(--sub); margin:0 0 6px; letter-spacing:.08em; font-weight:600; }
  h2.sp { margin-top:10px; }
  .chip { display:inline-block; padding:0 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; line-height:1.7; white-space:nowrap; }
  .chip.bad { color:var(--bad); border-color:currentColor; } .chip.warn { color:var(--warn); border-color:currentColor; } .chip.good { color:var(--good); border-color:currentColor; }
  .status { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; font-size:13px; align-items:center; }
  .ev h3 { margin:0 0 6px; font:700 17px/1.5 var(--font-display); text-wrap: balance; }
  .ev p { margin:0 0 10px; }
  button { font:inherit; }
  .ch { display:block; width:100%; text-align:left; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:9px 12px; margin:6px 0; cursor:pointer; }
  .ch:hover:not(:disabled) { border-color: var(--acc); }
  .ch:focus-visible, .btn:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .ch:disabled { opacity:.5; cursor:not-allowed; }
  .ch small { display:block; color:var(--sub); font-size:12px; }
  .ctl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 0; font-size:13px; }
  .btn { background:var(--acc); color:var(--acc-ink); border:0; border-radius:6px; padding:8px 14px; cursor:pointer; }
  .btn.alt { background:transparent; color:var(--ink); border:1px solid var(--line); }
  #news { max-height: 260px; overflow:auto; font-size:13px; display:grid; gap:0; }
  .nw { display:grid; grid-template-columns: 4.6em minmax(0,1fr); gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); }
  .nw .src { font-size:11px; font-weight:600; color:var(--sub); padding-top:2px; }
  .nw.warn .msg { color: var(--warn); } .nw.bad .msg { color: var(--bad); }
  .nw .when { display:block; font-size:11px; color:var(--sub); }
  .nw.fresh { animation: fresh 1.2s ease-out; }
  @keyframes fresh { from { background: color-mix(in srgb, var(--acc) 14%, transparent); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .nw.fresh { animation: none; } .bar i { transition: none; } }
  #log { max-height: 200px; overflow:auto; font-size:13px; }
  #log div { padding:3px 0; border-bottom:1px dashed var(--line); }
  #log .delayed { color: var(--sub); } #log .bad { color: var(--bad); }
  svg { width:100%; height:150px; display:block; }
  .legend { font-size:12px; display:flex; gap:12px; flex-wrap:wrap; margin-top:4px; }
  .legend span::before { content:""; display:inline-block; width:10px; height:3px; margin-right:4px; vertical-align:middle; background:currentColor; }
  .tw { overflow-x:auto; }
  table { border-collapse: collapse; width:100%; font-size:13px; font-variant-numeric: tabular-nums; }
  td, th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:right; white-space:nowrap; } th:first-child, td:first-child { text-align:left; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); margin:2px 4px 2px 0; font-size:12px; }
  .note { color:var(--sub); font-size:12px; }
  .empty { color:var(--sub); font-size:13px; }
  .sit { display:grid; gap:6px; margin:0 0 10px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); font-size:13px; }
  .sr { display:grid; grid-template-columns: 2.6em minmax(0,1fr); gap:8px; }
  .sk { font-weight:600; color:var(--acc); }
  .sn { display:block; font-variant-numeric: tabular-nums; font-weight:600; }
  .sv { display:block; color:var(--sub); }
  .tr { margin-left:2px; font-weight:600; } .tr.up { color:var(--good); } .tr.down { color:var(--bad); }
  .kpi { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:6px 10px; margin-bottom:4px; }
  .kpi div { display:flex; flex-direction:column; font-size:12px; color:var(--sub); }
  .kpi b { font-size:15px; color:var(--ink); font-variant-numeric: tabular-nums; }
  @media (max-width: 420px) { .kpi { grid-template-columns: repeat(2, minmax(0,1fr)); } }
</style>
<!-- /BUILD:HEAD -->
</head>
<body>
<!-- BUILD:BODY -->
<div class="wrap">
  <h1>RE-BURST 第1章 バブル崩壊と父の遺産</h1>
  <p class="lede">状態とルールで動く試作です。イベントは日付ではなく条件で出るので、史実の出来事も起きるとは限りません。金融の傷みやドンの疑惑は画面に出ません。右の「届いた知らせ」から読み取ってください。知らせを送ってくる人には、それぞれ偏りがあります。世界は遊ぶたびに少しずつ違います。</p>
  <div class="grid">
    <div class="col">
      <div class="card">
        <div class="head"><div class="date" id="date"></div><div class="world" id="world"></div></div>
        <div id="gauges"></div>
        <div class="ctl"><label><input type="checkbox" id="hidden"> 内部の値を見る（試作の確認用）</label></div>
        <div id="hiddenBox" hidden></div>
      </div>
      <div class="card">
        <h2>推移（1991年4月〜1993年8月）</h2>
        <svg id="chart" viewBox="0 0 300 150" preserveAspectRatio="none" role="img" aria-label="景気・財政・党の支持率・暮らしの実感の推移"></svg>
        <div class="legend" id="legend"></div>
      </div>
    </div>
    <div class="col right">
      <div class="card ev" id="evcard"></div>
      <div class="card"><h2>届いた知らせ</h2><div id="news"></div></div>
      <div class="card"><h2>これまで</h2><div id="log"></div></div>
    </div>
  </div>
</div>
<!-- /BUILD:BODY -->
<script src="engine.js"></script>
<script src="items.js"></script>
<script src="events.js"></script>
<script src="omens.js"></script>
<script src="app.js"></script>
</body>
</html>
